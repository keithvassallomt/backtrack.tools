{#- The coming-soon page and its 404 share this, until the site goes live. -#}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Backtrack{% endblock %}</title>
  {% block description %}{% endblock %}
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <style>
    :root {
      --bg: #fafafb;
      --fg: #1e1e24;
      --muted: #5e5e6a;
      --card: #ffffff;
      --border: #e3e3e8;
      --accent: #3b6fd9;
      --badge-bg: #e8effc;
      --badge-fg: #2a56b0;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #17171c;
        --fg: #ececf1;
        --muted: #a2a2ae;
        --card: #202027;
        --border: #30303a;
        --accent: #7aa2f7;
        --badge-bg: #23304d;
        --badge-fg: #a9c1fa;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: Inter, Cantarell, "Noto Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
      line-height: 1.55;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
    }
    main {
      width: 100%;
      max-width: 560px;
      text-align: center;
    }
    .icon {
      width: 128px;
      height: 128px;
      margin: 0 auto 24px;
      display: block;
    }
    h1 {
      font-size: 2.5rem;
      line-height: 1.1;
      margin: 0 0 8px;
      letter-spacing: -0.02em;
    }
    .tagline {
      font-size: 1.25rem;
      color: var(--muted);
      margin: 0 0 28px;
    }
    .badge {
      display: inline-block;
      background: var(--badge-bg);
      color: var(--badge-fg);
      font-weight: 600;
      font-size: 0.875rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 6px 14px;
      border-radius: 999px;
      margin-bottom: 28px;
    }
    .about {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px 24px;
      margin: 0 0 28px;
      text-align: left;
    }
    .about p { margin: 0; }
    a.github {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--accent);
      font-weight: 600;
      text-decoration: none;
    }
    a.github:hover, a.github:focus-visible { text-decoration: underline; }
    a.github svg { width: 20px; height: 20px; fill: currentColor; }
    .home { color: var(--accent); font-weight: 600; }
    footer {
      margin-top: 40px;
      font-size: 0.875rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  {% block main %}{% endblock %}
</body>
</html>
