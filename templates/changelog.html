{% extends "base.html" %}
{% block main %}
<div class="b-page">
  <div class="b-page-head">
    <h1 class="b-title">Changelog<em>.</em></h1>
  </div>
  <div class="b-doc">
    <nav class="b-toc" aria-label="Versions">
      <h2>Versions</h2>
      <ul>
        {%- for h in page.toc %}
        <li><a href="#{{ h.id }}">{{ h.title }}</a></li>
        {%- endfor %}
      </ul>
    </nav>
    <article class="prose">
{{ page.content | safe }}
    </article>
  </div>
</div>
{% endblock main %}
